<!DOCTYPE html>
<html>

<head>
    <title>Sarcasm Detection</title>

    <style>
        body {
    margin: 0;
    padding: 0;
    height: 100vh;

    display: flex;
    justify-content: flex-end;
    align-items: flex-end;

    background: url("/static/pic.jpg") no-repeat center center fixed;
    background-size: cover;
    font-family: 'Georgia', serif;
}

        .container {
    background: rgba(245, 235, 220, 0.85);   /* newspaper cream */
    padding: 40px;
    border-radius: 10px;
    text-align: center;
    width: 420px;
    margin: 30px;

    border: 2px solid #5c4a3d;               /* newspaper border */
    box-shadow: 0 0 15px rgba(0,0,0,0.3);

    color: #3e2f23;                          /* ink color */
}

        input[type="text"] {
    width: 80%;
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #5c4a3d;
    margin-top: 15px;
    background: #fffaf0;
}

        button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    background: #5c4a3d;
    color: white;
}

button:hover {
    background: #3e2f23;
}

        .result {
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
    color: #5c4a3d;
}
    </style>

</head>

<body>

    <div class="container">

        <h2>Sarcasm Detection in News Headlines</h2>

        <form action="/predict" method="post">

            <input type="text" name="headline"
                   placeholder="Enter News Headline"
                   value="{{ headline }}"
                   required>

            <br>

            <button type="submit">Check</button>

        </form>

        {% if prediction %}
        <div class="result">
            Result: {{ prediction }}
        </div>
        {% endif %}

    </div>

</body>

</html>
